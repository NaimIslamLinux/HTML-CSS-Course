<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>l4</title>
    <style>
        button {
            border: none;
            color: white;
            background: green;
            padding: 5px 10px;
            cursor: pointer;
            margin: 0 10px;
            transition: 0.5s;
        }

        button:hover {
            padding: 5px 20px;
            margin: 0;
        }
    </style>
</head>
<body>
    <button class="one">
        One
    </button>
    <button class="two">
        Two
    </button>
    <button class="three">
        Three
    </button>
</body>
</html>
