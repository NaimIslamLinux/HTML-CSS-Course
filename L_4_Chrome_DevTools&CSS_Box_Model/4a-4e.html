<head>
  <title>nothing</title>
</head>
<style>
  .uber-button {
    background-color: black;
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    transition: 0.5s ease-in;
  }
  
  .uber-button:hover {
	opacity: 0.7;
  }

  .amazon-button {
    background-color: rgb(255,216,20);
    border: none;
    padding: 10px 40px;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.5s ease-in;
  }
  
  .amazon-button:hover {
	background-color: rgb(235,196,0);
  }

  .github-button {
    background-color: rgb(46,164,79);
    color: white;
    font-weight: bold;
    border: none;
    padding: 8px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: box-shadow 0.5s ease-out;
  }
  
  .github-button:hover {
	box-shadow: 0 2px 10px rgba(59, 59, 56, 0.68);
  }

  .bootstrap-getstarted-button {
    background-color: rgb(121,82,179);
    color: white;
    border: none;
    padding: 8px 15px;
    font-weight: bold;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 0.5s ease;
  }
  
  .bootstrap-getstarted-button:hover {
	background-color: rgb(101,62,159);
  }

  .bootstrap-download-button {
    background-color: white;
    color: rgb(108,117,125);
    padding: 8px 15px;
    border: 1px solid rgb(108,117,125);
    font-weight: bold;
    border-radius: 2px;
    cursor: pointer;
    transition: 0.5s linear;
  }
  
  .bootstrap-download-button:hover {
	background-color: gray;
	color: white;
	border-color: white;
  }

  .linkedin-apply-button {
    background: rgb(10, 102, 194);
    color: white;
    font-weight: bold;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.5s linear;
  }
  
  .linkedin-apply-button:hover {
	background: rgb(0, 52, 144);
  }

  .linkedin-save-button {
    background-color: white;
    color: rgb(10, 102, 194);
    border: 1px solid rgb(10, 102, 194);
    padding: 5px 15px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.5s ease-out;
  }
  
  .linkedin-save-button:hover {
	border-width: 2px;
	background-color: rgba(90, 182, 274, 0.2);
  }
</style>
<body>
  
<p>Uber</p>
<button class="uber-button">
  Request now
</button>

<p>Amazon</p>
<button class="amazon-button">
  Add to Cart
</button>

<p>GitHub</p>
<button class="github-button">
  Sign up
</button>

<p>Bootstrap</p>
<button class="bootstrap-getstarted-button">
  Get started
</button>
<button class="bootstrap-download-button">
  Download
</button>

<p>Linkedin</p>
<button class="linkedin-apply-button">
  Apply to company website
</button>
<button class="linkedin-save-button">
  Save
</button>

</body>
