<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
    <style>
        p {
            font-family: arial;
            margin-top: 0;
            margin-bottom: 0;
            font-size: 14px;
            color: rgb(96, 96, 96);
        }
        .video-title {
            font-size: 20px;
            font-weight: bold;
            width: 350px;
            margin-bottom: 5px;
            color: black;
            line-height: 1.2;
        }

        .video-state {
            margin-bottom: 20px;
        }

        .video-aouther {
            margin-bottom: 20px;
        }

        .video-discription {
            width: 280px;
            line-height: 1.3;
        }
        
        .apple-msg {
            background-color: rgb(227, 65, 64);
            padding: 18px;
            color: white;
            text-align: center;
            margin-top: 20px;
        }

        .shopnow-text:hover {
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <p class="video-title">
        Talking Tech and AI with Google CEO Sundar Pichai!
    </p>
    <p class="video-state">
        3.4M views &middot; 6 months ago
    </p>
    <p class="video-aouther">
        Marques Brownlee &check;
    </p>
    <p class="video-discription">
        Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from Google's CEO. Shoutout to Sundar!
    </p>

    <p class="apple-msg">
        Shop early for the best selection of holiday favourites. <span class="shopnow-text">Shop now ></span>
    </p>
</body>
</html>
