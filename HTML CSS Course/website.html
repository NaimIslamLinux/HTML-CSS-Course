<!DOCTYPE html>
<html>
  <head>
    <title>YouTube Website</title>
    <link rel="stylesheet" href="styles/website.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/video-grid.css">
    <link rel="stylesheet" href="styles/side-bar.css">
  </head>
  <body>

    <div class="header">

      <div class="start">
        <img class="yt-icon" src="images/icons/bars-solid-full.svg">
        <img class="yt-logo" src="images/icons/Youtube-Logo.png">
      </div>

      <div class="center">
        <div class="search-container">
        <input type="text" class="search-box" placeholder="Search">
        <img class="search-icon" src="images/icons/magnifying-glass-solid-full.svg">
        </div>
        <img class="mic-icon" src="images/icons/microphone-solid-full.svg">
      </div>

      <div class="end">
        <div class="create-video-button">
          <img class="yt-icon" src="images/icons/plus-solid-full.svg">
          Create
        </div>
        <img class="notification-icon" src="images/icons/bell-regular-full.svg">
        <img class="yt-profile" src="images/channels/user.png">
      </div>

    </div>

    <div class="side-bar">

      <div class="side-items">
        <img src="images/icons/house-regular-full.svg" class="side-icon">
        <p class="icon-name">Home</p>
      </div>
      <div class="side-items">
        <img src="images/icons/youtube-shorts-brands-solid-full.svg" class="side-icon">
        <p class="icon-name">Shorts</p>
      </div>
      <div class="side-items">
        <img src="images/icons/square-youtube-brands-solid-full.svg"
        class="side-icon">
        <p class="icon-name">Subscription</p>
      </div>
      <div class="side-items">
        <img src="images/icons/circle-user-regular-full.svg" class="side-icon">
        <p class="icon-name">You</p>
      </div>

    </div>

    <div class="video-grid js-video-grid">

      

    </div>
    
    <!-- <script type="module" src="scripts/website.js"></script> -->
  </body>
</html>
